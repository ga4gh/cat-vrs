$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/cat-vrs/1.1.0-ballot.2026-07.1/recipes-source.yaml"
title: GA4GH-Cat-VRS-Recipe-Definitions
type: object

imports:
  cat-vrs: ./cat-vrs-source.yaml
  gks-core: ../gks-core/gks-core-source.yaml
  vrs: ../vrs/vrs-source.yaml

namespaces:
  gks.core: /ga4gh/schema/gks-core/1.2.0-ballot.2026-07.1/json/
  vrs: /ga4gh/schema/vrs/2.1.0-ballot.2026-07.1/json/

$defs:
  ProteinSequenceConsequence:
    maturity: trial use
    description: >-
      A change that occurs in a protein sequence as a result of genomic changes. Due to the degenerate nature
      of the genetic code, there are often several genomic changes that can cause a protein sequence consequence.
      The protein sequence consequence, like a :ref:`CanonicalAllele`, is defined by an
      :ref:`Allele` that is representative of a collection of congruent Protein Alleles that share the same altered codon(s).
    allOf:
      - $ref: CategoricalVariant
      - properties:
          constraints:
            contains:
              allOf:
                - $ref: DefiningAlleleConstraint
                - type: object
                  properties:
                    relations:
                      allOf:
                        - contains:
                            type: object
                            properties:
                              primaryCoding:
                                code:
                                  const: translation_of
                                system:
                                  const: http://www.sequenceontology.org
                      maxContains: 1

  CanonicalAllele:
    maturity: trial use
    description: >-
      A canonical allele is defined by an :ref:`Allele` that is representative of a collection of congruent
      Alleles, each of which depict the same nucleic acid on different underlying reference sequences.
      Congruent representations of an Allele often exist across different genome assemblies and associated
      cDNA transcript representations.
    allOf:
      - $ref: CategoricalVariant
      - properties:
          constraints:
            minItems: 1
            maxItems: 1
            contains:
              allOf:
                - $ref: DefiningAlleleConstraint
                - type: object
                  properties:
                    relations:
                      allOf:
                        - contains:
                            type: object
                            properties:
                              primaryCoding:
                                code:
                                  const: liftover_to
                                system:
                                  const: ga4gh-gks-term:allele-relation
                        - contains:
                            type: object
                            properties:
                              primaryCoding:
                                code:
                                  const: transcribed_to
                                system:
                                  const: http://www.sequenceontology.org
                      maxContains: 2

  CategoricalCnv:
    maturity: draft
    description: >-
      A representation of the constraints for matching knowledge about CNVs.
    allOf:
      - $ref: CategoricalVariant
      - properties:
          constraints:
            minItems: 2
            maxItems: 2
            description: >-
              The constraints array must contain exactly two items:
              a DefiningLocationConstraint and either a CopyChangeConstraint
              or CopyCountConstraint.
            allOf:
              - contains:
                  allOf:
                    - $ref: DefiningLocationConstraint
                    - properties:
                        relations:
                          contains:
                            properties:
                              primaryCoding:
                                code:
                                  const: liftover_to
                                system:
                                  const: ga4gh-gks-term:allele-relation
              - contains:
                  oneOf:
                    - $ref: CopyCountConstraint
                    - $ref: CopyChangeConstraint

  FunctionVariant:
    maturity: draft
    description: >-
      A representation of the constraints for matching knowledge about function variants; e.g., gain-of-function or loss-of-function.
    allOf:
      - $ref: CategoricalVariant
      - properties:
          constraints:
            description: >-
              The constraints must contain at least two items:
              a FunctionConstraint and either a DefiningAlleleConstraint, DefiningLocationConstraint, or FeatureContextConstraint.
            minItems: 2
            allOf:
              - contains:
                  allOf:
                    - $ref: FunctionConstraint
              - contains:
                  anyOf:
                    - $ref: DefiningAlleleConstraint
                    - $ref: DefiningLocationConstraint
                    - $ref: FeatureContextConstraint
        required:
          - constraints

  GeneFusion:
    maturity: draft
    description: >-
      A representation of the joining of two genes resulting in a chimeric transcript and/or novel interaction between a rearranged regulatory elements with the expression of a partner gene product (a regulatory fusion).
    allOf:
      - $ref: CategoricalVariant
      - properties:
          constraints:
            description: >-
              The constraints must contain at least one item of an Adjacency Constraint.
            minItems: 1
            contains:
              allOf:
                - $ref: AdjacencyConstraint
                - properties:
                    adjoinedElements:
                      contains:
                        anyOf:
                          - $refCurie: gks.core:iriReference
                          - $refCurie: gks.core:MappableConcept
                          - $refCurie: vrs:Location
                          - $ref: UnspecifiedElement
        required:
          - constraints

  CompoundHeterozygote:
    maturity: draft
    description: >-
      A Composite Categorical Variant that joins exactly two elements with the AND
      operator and a trans phase relation, where each element represents one haplotype:
      either a present Categorical Variant Criterion, or a Composite Categorical Variant
      that joins two or more present Categorical Variant Criteria with the AND operator
      and a cis phase relation. The two elements MUST NOT represent the same haplotype.
    allOf:
      - $ref: CompositeCategoricalVariant
      - properties:
          operator:
            const: AND
          phaseRelation:
            const: trans
          elements:
            description: >-
              The elements array must contain exactly two haplotypes, each of which
              is either a present Categorical Variant Criterion or a Composite
              Categorical Variant of two or more present Categorical Variant Criteria
              in cis.
            minItems: 2
            maxItems: 2
            items:
              oneOf:
                - allOf:
                    - $ref: CategoricalVariantCriterion
                    - properties:
                        presence:
                          const: present
                - allOf:
                    - $ref: CompositeCategoricalVariant
                    - properties:
                        operator:
                          const: AND
                        phaseRelation:
                          const: cis
                        elements:
                          minItems: 2
                          items:
                            allOf:
                              - $ref: CategoricalVariantCriterion
                              - properties:
                                  presence:
                                    const: present
                      required:
                        - phaseRelation
        required:
          - phaseRelation

  StarAllele:
    maturity: draft
    description: >-
      A Composite Categorical Variant that joins one or more present Categorical
      Variant Criteria with the AND operator and a cis phase relation, representing a
      haplotype of a single gene defined by those variants.
    allOf:
      - $ref: CompositeCategoricalVariant
      - properties:
          operator:
            const: AND
          phaseRelation:
            const: cis
          elements:
            description: >-
              The elements array must contain one or more present Categorical Variant
              Criteria, each defining a variant of the haplotype.
            minItems: 1
            items:
              allOf:
                - $ref: CategoricalVariantCriterion
                - properties:
                    presence:
                      const: present
        required:
          - phaseRelation

  Diplotype:
    maturity: draft
    description: >-
      A Composite Categorical Variant that joins exactly two Star Alleles of the same
      gene with the AND operator and a trans phase relation.
    allOf:
      - $ref: CompositeCategoricalVariant
      - properties:
          operator:
            const: AND
          phaseRelation:
            const: trans
          elements:
            description: >-
              The elements array must contain exactly two Star Alleles, each a
              Composite Categorical Variant of one or more present Categorical
              Variant Criteria in cis.
            minItems: 2
            maxItems: 2
            items:
              allOf:
                - $ref: CompositeCategoricalVariant
                - properties:
                    operator:
                      const: AND
                    phaseRelation:
                      const: cis
                    elements:
                      minItems: 1
                      items:
                        allOf:
                          - $ref: CategoricalVariantCriterion
                          - properties:
                              presence:
                                const: present
                  required:
                    - phaseRelation
        required:
          - phaseRelation
