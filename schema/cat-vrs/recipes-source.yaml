$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/cat-vrs/1.0.0/recipes-source.yaml"
title: GA4GH-Cat-VRS-Recipe-Definitions
type: object

imports:
  cat-vrs: ./cat-vrs-source.yaml

namespaces:
  gks.core: /ga4gh/schema/gks-core/1.0.0/json/
  vrs: /ga4gh/schema/vrs/2.0.1/json/

$defs:
  DescribedVariant:
    maturity: draft
    description: >-
      A Categorical Variant object that may or may not be represented with constraints. This Recipe is used to validate
      instances of the :ref:`CategoricalVariant` class, regardless of Recipes being satisfied. Implementers may choose
      to represent Categorical Variants *without* any constraints while waiting for this specification to support a
      means to model them.
    allOf:
      - $ref: CategoricalVariant
      - properties:
          constraints:
            contains:
              anyOf:
                - $ref: CopyChangeConstraint
                - $ref: CopyCountConstraint
                - $ref: DefiningAlleleConstraint
                - $ref: DefiningLocationConstraint
                - $ref: FeatureContextConstraint

  CanonicalAllele:
    maturity: trial use
    description: >-
      A canonical allele is defined by an :ref:`Allele` that is representative of a collection of congruent
      Alleles, each of which depict the same nucleic acid different underlying reference sequences.
      Congruent representations of an Allele often exist across different genome assemblies and associated
      cDNA transcript representations.
    allOf:
      - $ref: CategoricalVariant
      - properties:
          constraints:
            minItems: 1
            maxItems: 1
            contains:
              allOf:
                - $ref: DefiningAlleleConstraint
                - type: object
                  properties:
                    relations:
                      allOf:
                        - contains:
                            type: object
                            properties:
                              primaryCoding:
                                code:
                                  const: liftover_to
                                system:
                                  const: ga4gh-gks-term:allele-relation
                        - contains:
                            type: object
                            properties:
                              primaryCoding:
                                code:
                                  const: transcribed_to
                                system:
                                  const: http://www.sequenceontology.org
                      maxContains: 2

  CategoricalCnv:
    maturity: draft
    description: >-
      A representation of the constraints for matching knowledge about CNVs.
    allOf:
      - $ref: CategoricalVariant
      - properties:
          constraints:
            minItems: 2
            description: >-
              The constraints array must contain at least two items:
              a DefiningLocationConstraint and either a CopyChangeConstraint
              or CopyCountConstraint.
            allOf:
              - contains:
                  allOf:
                    - $ref: DefiningLocationConstraint
                    - properties:
                        relations:
                          contains:
                            properties:
                              primaryCoding:
                                code:
                                  const: liftover_to
                                system:
                                  const: ga4gh-gks-term:allele-relation
              - contains:
                  oneOf:
                    - $ref: CopyCountConstraint
                    - $ref: CopyChangeConstraint

  ProteinSequenceConsequence:
    maturity: trial use
    description: >-
      A change that occurs in a protein sequence as a result of genomic changes. Due to the degenerate nature
      of the genetic code, there are often several genomic changes that can cause a protein sequence consequence.
      The protein sequence consequence, like a :ref:`CanonicalAllele`, is defined by an
      :ref:`Allele` that is representative of a collection of congruent Protein Alleles that share the same altered codon(s).
    allOf:
      - $ref: CategoricalVariant
      - properties:
          constraints:
            contains:
              allOf:
                - $ref: DefiningAlleleConstraint
                - type: object
                  properties:
                    relations:
                      allOf:
                        - contains:
                            type: object
                            properties:
                              primaryCoding:
                                code:
                                  const: translation_of
                                system:
                                  const: http://www.sequenceontology.org
                      maxContains: 1
