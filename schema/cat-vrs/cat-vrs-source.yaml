$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/cat-vrs/v1/cat-vrs-source.yaml"
title: GA4GH-Cat-VRS-Definitions
type: object
strict: true

imports:
  gkm-core: ../gkm-core/gkm-core-source.yaml
  vrs: ../vrs/vrs-source.yaml

namespaces:
  gkm.core: /ga4gh/schema/gkm-core/1.2.0-ballot.2026-07.1/json/
  vrs: /ga4gh/schema/vrs/2.1.0-ballot.2026-07.1/json/

$defs:

  # =============================================================================
  # Top-level Categorical Variant concept
  # =============================================================================

  CategoricalVariant:
    type: object
    inherits: gkm-core:Entity
    maturity: trial use
    description: >-
      A representation of a categorically-defined domain for variation, in which individual
      Constraintual variation instances may be members of the domain.
    properties:
      type:
        extends: type
        const: CategoricalVariant
        default: CategoricalVariant
        description: 'MUST be "CategoricalVariant"'
      members:
        type: array
        ordered: false
        description: >-
          A non-exhaustive list of VRS Variations that satisfy the constraints of
          this categorical variant.
        items:
          oneOf:
            - $refCurie: vrs:Variation
            - $refCurie: gkm.core:iriReference
      constraints:
        type: array
        ordered: false
        items:
          $ref: "#/$defs/Constraint"
      mappings:
        type: array
        ordered: false
        items:
          $refCurie: gkm.core:ConceptMapping
        description: >-
          A list of mappings to concepts in terminologies or code systems. Each mapping should
          include a coding and a relation.
    required:
      - name
      - type

  # =============================================================================
  # Constraint Definitions
  # =============================================================================

  Constraint:
    maturity: trial use
    description: >-
      Constraints are used to construct an intensional semantics of categorical variant types.
    oneOf:
      - $ref: "#/$defs/DefiningAlleleConstraint"
      - $ref: "#/$defs/DefiningLocationConstraint"
      - $ref: "#/$defs/AdjacencyConstraint"
      - $ref: "#/$defs/FeatureContextConstraint"
      - $ref: "#/$defs/CopyCountConstraint"
      - $ref: "#/$defs/CopyChangeConstraint"
      - $ref: "#/$defs/FunctionConstraint"
    heritableProperties:
      type:
        type: string
        description: >-
          MUST be set to the name of the concrete Constraint subtype.
    heritableRequired:
      - type

  DefiningAlleleConstraint:
    maturity: trial use
    type: object
    inherits: Constraint
    description: >-
      The defining allele and its associated relationships that are congruent
      with member variants.
    properties:
      type:
        extends: type
        const: DefiningAlleleConstraint
        default: DefiningAlleleConstraint
        description: 'MUST be "DefiningAlleleConstraint"'
      allele:
        oneOf:
          - $refCurie: vrs:Allele
          - $refCurie: gkm.core:iriReference
      relations:
        type: array
        ordered: false
        items:
          $refCurie: gkm.core:MappableConcept
        description: >-
          Defined relationships from which members relate to the defining allele.
    required:
      - allele

  DefiningLocationConstraint:
    maturity: trial use
    type: object
    inherits: Constraint
    description: >-
      The defining location and its associated relationships that are congruent
      with member locations.
    properties:
      type:
        extends: type
        const: DefiningLocationConstraint
        default: DefiningLocationConstraint
        description: 'MUST be "DefiningLocationConstraint"'
      location:
        oneOf:
          - $refCurie: vrs:SequenceLocation
          - $refCurie: gkm.core:iriReference
      relations:
        type: array
        ordered: false
        items:
          $refCurie: gkm.core:MappableConcept
        description: >-
          Defined relationships from which members relate to the defining location.
      matchCharacteristic:
        $refCurie: gkm.core:MappableConcept
        description: >-
          A characteristic of the location that is used to match the defining location to member locations.
    required:
      - location
      - matchCharacteristic

  CopyCountConstraint:
    maturity: trial use
    inherits: Constraint
    type: object
    description:
      The exact or range of copies that members of this categorical
      variant must satisfy.
    properties:
      type:
        extends: type
        const: CopyCountConstraint
        default: CopyCountConstraint
        description: 'MUST be "CopyCountConstraint"'
      copies:
        description: >-
          The precise value or range of copies members of this categorical
          variant must satisfy.
        oneOf:
          - type: integer
          - $refCurie: vrs:Range
    required:
      - copies

  CopyChangeConstraint:
    maturity: draft
    inherits: Constraint
    type: object
    description: >-
      The relative assessment of the change in copies that members of
      this categorical variant satisfy.
    properties:
      type:
        extends: type
        const: CopyChangeConstraint
        default: CopyChangeConstraint
        description: 'MUST be "CopyChangeConstraint"'
      copyChange:
        description: >-
          The relative assessment of the change in copies that members of
          this categorical variant satisfies.
        type: string
        enum:
          - complete genomic loss
          - high-level loss
          - low-level loss
          - loss
          - regional base ploidy
          - gain
          - low-level gain
          - high-level gain
    required:
      - copyChange

  FeatureContextConstraint:
    maturity: draft
    type: object
    inherits: Constraint
    description: >-
      The feature that members of this categorical variant are associated with.
    properties:
      type:
        extends: type
        const: FeatureContextConstraint
        default: FeatureContextConstraint
        description: 'MUST be "FeatureContextConstraint"'
      featureContext:
        description: A feature identifier.
        $refCurie: gkm.core:MappableConcept
    required:
      - featureContext

  FunctionConstraint:
    maturity: draft
    type: object
    inherits: Constraint
    description: >-
      A classification of the protein functional consequence that characterizes members of this categorical variant.
    properties:
      type:
        extends: type
        const: FunctionConstraint
        default: FunctionConstraint
        description: 'MUST be "FunctionConstraint"'
      functionConsequence:
        description: >
          The functional consequence of members of this categorical variant, as defined by an external ontology. We recommend using one of the defined terms from `The Sequence Ontology
          <http://www.sequenceontology.org>`_. See Implementation Guidance for more details.
        $refCurie: gkm.core:MappableConcept
      description:
        description: >-
          A free-text description of the function change.
        type: string
    required:
      - functionConsequence

  AdjacencyConstraint:
    maturity: draft
    type: object
    inherits: Constraint
    description: >-
      Components that define a molecular adjacency of congruent elements.
    properties:
      type:
        extends: type
        const: AdjacencyConstraint
        default: AdjacencyConstraint
        description: 'MUST be "AdjacencyConstraint"'
      adjoinedElements:
        type: array
        description: >-
          The elements of the adjacency.
        minItems: 2
        maxItems: 2
        ordered: true
        items:
          oneOf:
            - $refCurie: gkm.core:iriReference
            - $refCurie: gkm.core:MappableConcept
            - $refCurie: vrs:Location
            - $refCurie: vrs:Terminus
            - $ref: "#/$defs/UnspecifiedElement"
      functionalDomains:
        type: array
        description: >-
          Functional domains whose presence or absence is required to satisfy the adjacency.
        ordered: false
        items:
          $ref: "#/$defs/FunctionalDomain"
      linker:
        $refCurie: vrs:SequenceExpression
        description: The sequence found between the adjoined elements.
      orderKnown:
        type: boolean
        description: >-
          When orderKnown is true, the order of adjoinedElements is assumed to denote the 5' partner first and the 3' partner second. If orderKnown is false, then the order of adjoinedElements assumed not in fact to be known, as in the case of a fusion where only one or both partners are known, but not their relative order. This field is redundant and may be set to true when using Sequence Locations and following the VRS 2 Adjacency model, as the order is implied by the usage of start and end on respective adjoinedElements.
    required:
      - adjoinedElements
      - orderKnown

  FunctionalDomain:
    maturity: draft
    inherits: gkm-core:Entity
    type: object
    # Protected class of: AdjacencyConstraint
    description: A sequence location whose presence or absence is used to define an adjacency.
    properties:
      type:
        extends: type
        const: FunctionalDomain
        default: FunctionalDomain
        description: Must be "FunctionalDomain"
      location:
        $refCurie: vrs:Location
        description: >-
          A Sequence Location for the domain.
      status:
        type: string
        description: MUST be either "preserved" or "lost"
        enum:
          - lost
          - preserved
    required:
      - location
      - status

  UnspecifiedElement:
    maturity: draft
    inherits: gkm-core:Entity
    type: object
    # Protected class of: AdjacencyConstraint
    description: Represents an unspecified element that satisfies the described adjacency.
    properties:
      type:
        extends: type
        const: UnspecifiedElement
        default: UnspecifiedElement
        description: Must be "UnspecifiedElement"
    additionalProperties: false
