title: Title
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Use this template to propose a modification to an existing feature in the specification.
        >
        > If your implementation has not been previously registered with the [Genomic Knowledge Standards Work Stream](https://ga4gh.github.io/gks.github.io/), please complete the [GKS Product Implementer Form](https://docs.google.com/forms/d/e/1FAIpQLSfVKA6LmeDNYxH7ssnyk0ifRtLCgQKlZfoUzXxzO-h6JkX0og/viewform?usp=sf_link).

  - type: input
    id: feature-name
    attributes:
      label: Feature name
      description: Name of the feature within the specification that you are proposing to modify.
      placeholder: For example, DefiningAlleleConstraint
    validations:
      required: true

  - type: textarea
    id: problem-statement
    attributes:
      label: Problem statement and rationale
      description: What problem or limitation in the current feature motivates this change? Please include use cases.
    validations:
      required: true

  - type: textarea
    id: proposed-change
    attributes:
      label: Proposed change
      description: Describe the modification you are proposing. Be specific about what would change in the specification.
    validations:
      required: true

  - type: dropdown
    id: change-nature
    attributes:
      label: Nature of change
      description: Is this change backwards-compatible with existing draft implementations?
      options:
        - Backwards-compatible (existing implementations remain valid)
        - Backwards-incompatible (existing implementations would need to be updated)
        - Unsure
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example categorical variant(s) — before and after
      description: Provide at least one example of a categorical variant, both how it would be represented with the current specification and what how it may be represented based on the proposed change.
      placeholder: |
        **Current:**
        ```yaml

        ```

        **After:**
        ```yaml

        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What alternative approaches did you consider? This supports the design decision documentation required by the GKS product development process.
    validations:
      required: false

  - type: textarea
    id: open-questions
    attributes:
      label: Anticipated open questions and design decisions
      description: List questions or design choices that you think are likely to arise during the development of this feature.
    validations:
      required: false

  - type: textarea
    id: priority
    attributes:
      label: Priority
      description: How soon do you need this change? Is this a Blocking (need in 0 - 3 months), Near term (3 - 6 months), Mid term (6 - 12 months), or Future (12+ months) need?
    validations:
      required: false
