# There may be a unintended assumption that the location ids create a 1-to-1 mapping of the columns in the star allele definition table.
# If we think there's utility in having a column-wise association between the locations and the star allele definition table columns,
# then we might consider using the column numbers as the ids.  This would allow us to have a more compact representation of the
# star allele set definition table, and we could use the column numbers to reference the locations in the starMap
# and starAllele definitions.  -- consider how important it is to have the starMap and starAlleleSet be row/col aligned in their computational form.
# NOTE 1 - I believe it is possible that there may be more than one location id per column since the normalization can result
# in multiple locations being represented by a single column in the star allele definition table.  If that is the case, we
# would need to have a more complex mapping of the column numbers to the location ids.
# NOTE 2 - also be aware that new columns can be inserted in the definition table over time since they are ordered by the start position.
location:
    'ga4gh:SL.???747':   # column B (rs769369441)
        id: # up for discussion - come back to this
        type: SequenceLocation
        start: 48037747
        end: 48037748
        sequenceReference: "#/sequenceReference/NC_000013.11"
    'ga4gh:SL.???748':   # column C
        id: SL.HLz8ZSGs...
        type: SequenceLocation
        start: 48037748
        end: 48037749
        sequenceReference: "#/sequenceReference/NC_000013.11"
    'ga4gh:SL.nBEeX_KA':  # column D in allele definition table
        id: SL.nBEeX_KA...
        type: SequenceLocation
        start: 48037782
        end: 48037801
        sequenceReference: "#/sequenceReference/NC_000013.11"
    # adding in col Q so that we can differentiate between *1 and *3 properly.
