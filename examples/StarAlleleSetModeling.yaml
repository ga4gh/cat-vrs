## this master star allele set which can be versioned is really a star allele model IMO, but it has the addition of a version and gene that is shared by all starAlleles it defines
starAlleleSet: 
    'SAS.NUDT15': 
        id: SAS.NUDT15
        version: 2026.04.21
        gene: NUDT15
        referenceMap: # this is the only inherent property
            - location: '#/location/ga4gh:SL.???747'
              alleles:
                  - '#/allele/ga4gh:ga4gh:VA.??747T='
                  - '#/allele/ga4gh:ga4gh:ga4gh:VA.??747TC'
            - location: '#/location/ga4gh:SL.???748'
              alleles:
                  - '#/allele/ga4gh:ga4gh:VA.??748G='
                  - '#/allele/ga4gh:ga4gh:VA.??748GC'
            - location: '#/location/ga4gh:SL.???Rep'
              alleles:
                  - '#/allele/ga4gh:ga4gh:VA.??Rep2'
                  - '#/allele/ga4gh:ga4gh:VA.??Rep3'
                  - '#/allele/ga4gh:ga4gh:VA.??Rep4'
                    
# if we could define these starAlleles so the MUST reference the same starAlleleSet for every element within that would be the best approach. not sure my approach below gets us all the way there.
starAlleles: 
    'NUDT15.*1':        
        type: CategoricalVariant
        categoricalVariantType: StarAllele

        # defining star allele set 
        starAlleleSet: '#/starAlleleSet/SAS.NUDT15' # referencing the star allele set that defines the permitted values for this star allele.

        ## I think we want to have the constraints below be directly referencing the starAlleleSet.starMap values
        setConstraints:
            # referencing by array position is suboptimal but I can't figure a better solution just yet.
            - location: 'ga4gh:SL.???747'
              alleles: 
                  # like the starmap.alleles in the starAlleleSet, any of the elements in this list would satisfy the condition that this starMap entry is satisified.
                  - 'ga4gh:VA.??747T='
            - location: 'ga4gh:SL.???748'
              alleles:
                  - 'ga4gh:VA.??748G='
            - location: '#/location/ga4gh:SL.???Rep' # come back to this later
              alleles:
                  - 'ga4gh:VA.??Rep3'
    'NUDT15.*3': # come back to this
        type: CategoricalVariant
        categoricalVariantType: StarAllele
