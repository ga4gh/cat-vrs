## this master star allele set which can be versioned is really a star allele model IMO, but it has the addition of a version and gene that is shared by all starAlleles it defines
starAlleleSet:
    'SAS.NUDT15':
        id: SAS.NUDT15
        version: 2026.04.21
        gene: NUDT15
        referenceMap: # this is the only inherent property
            - location: '#/location/ga4gh:SL.???747'
              alleles:
                  - '#/allele/ga4gh:VA.??747T='
                  - '#/allele/ga4gh:VA.??747TC'
            - location: '#/location/ga4gh:SL.???748'
              alleles:
                  - '#/allele/ga4gh:VA.??748G='
                  - '#/allele/ga4gh:VA.??748GC'
            - location: '#/location/ga4gh:SL.nBEeX_KA...'
              alleles:
                  - '#/allele/ga4gh:VA.??Rep2'
                  - '#/allele/ga4gh:VA.??Rep3'
                  - '#/allele/ga4gh:VA.??Rep4'
            - location: '#/location/ga4gh:SL.UpTKp0U4L'
              alleles:
                  - '#/allele/g.48045719C='
                  - '#/allele/g.48045719C>T'


# if we could define these starAlleles so the MUST reference the same starAlleleSet for every element within that would be the best approach. not sure my approach below gets us all the way there.
starAlleles:
    'NUDT15.*1':
        # since these are versioned I think of them more as versioned domain entities yet to be defined for reference by the community, they are NOT CisPhaseBlocks until they are observed.

        type: CategoricalVariant     ## this should represent the type of object not a generalized thing IMO
        categoricalVariantType: StarAllele ## like this

        # defining star allele set
        starAlleleSet: '#/starAlleleSet/SAS.NUDT15' # referencing the star allele set that defines the starMap for this star allele.

        # using the starmap entries to determine if an incoming observed CisPhaseBlock has NO members that fall outside the starMap would create a match
        # additionally we could add an attribute to say which starMap locations are "Required" to be met to meet the minimal viable definition of the star allele!

        ## I think we want to have the starMap constraints below be directly referencing the starAlleleSet.starMap values
        setConstraints:
            # referencing by array position is suboptimal but I can't figure a better solution just yet.
            - location: '#/location/ga4gh:SL.???747'
              alleles:
                  # like the starmap.alleles in the starAlleleSet, any of the elements in this list would satisfy the condition that this starMap entry is satisified.
