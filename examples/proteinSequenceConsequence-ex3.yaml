# Read more about the Cat-VRS data model, here:
# https://cat-vrs.readthedocs.io/en/latest/concepts/catvrs_model.html

# id: The ‘logical’ identifier of the Entity in the system of record, e.g. a UUID.
# This ‘id’ is unique within a given system, but may or may not be globally unique outside the system.
# It is used within a system to reference an object from another.
id: 0

# name: A primary name for the entity.
name: BRAF V600

type: CategoricalVariant

# The types of CategoricalVariants are dictated by "recipes", found in schema/cat-vrs/recipes-source.yaml
# Here, we describe a Protein Sequence Consequence for BRAF V600 variants


# description: A free-text description of the entity
description: >-
  BRAF V600 variants are missense amino acid substitutions that result in Valine changed.
  V600E is the most common substitution, but V600K, V600M, V600R, and V600G have also been observed.

aliases:
  - NM_004333.6(BRAF):p.Val600

# extensions: A list of extensions to the Entity, that allow for capture of information not directly
# supported by elements defined in the model.
# The decision of how to structure extensions are left to implementers, though we recommend
# documenting an implementation's use of extensions in the Standard Operating Procedure to
# promote ease of use
extensions:
  -

# constraints: A rule or set of rules that must bve satisfied for a Categorical Variant to be considered valid.
# constraints are defined within schema/cat-vrs/cat-vrs-source.yaml
# and they are also described online: https://cat-vrs.readthedocs.io/en/latest/concepts/catvrs_model.html#constraint
# For each categorical variant, there may be 0 to n constraints.
constraints:
  # The DefiningAlleleConstraint describes variation relative to a VRS allele
  # The VRS allele can be transcribed in full, or abbreviated with the notation vrs.json#/ga4gh:VA...
  # Here, we first describe a DefiningAlleleConstraint in full before using an abbreviated notation to describe a second constraint
  - type: DefiningLocationConstraint
    location:
      id: ga4gh:SL.t-3DrWALhgLdXHsupI-e-M00aL3HgK3y
      name:
      description:
      aliases:
      extensions:
      digest: t-3DrWALhgLdXHsupI-e-M00aL3HgK3y
      type: SequenceLocation
      sequenceReference:
        type: SequenceReference
        refgetAccession: SQ.cQvw4UsHHRRlogxbWCB8W-mKD4AraM9y"
      start:
      end:
      sequence:
    relations:
      primaryCoding:
        code: translation_of
        system: http://www.sequenceontology.org
        iris:
          - http://www.sequenceontology.org/browser/current_release/term/translation_of
    matchCharacteristic:
      primaryCoding:
        code: is_within
        system: ga4gh-gks-term:location-match
  # TO DO: Here, we may need to have a NOT definingalleleconstraint

