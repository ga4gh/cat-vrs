    subject:
      type: CategoricalVariant
      name: KRAS exon 2 codon 12
      constraints:
        - type: DefiningLocationConstraint
          location:
            id: ga4gh:SL.ovJR3lKrIflg4zDUU3Q-XH715XkwgTJl
            type: SequenceLocation
            description: Amino acid position 12 of the Refseq protein NP_004976.2, which is the protein product of the MANE Select coding transcript for KRAS (NM_004985.5).
            digest: ovJR3lKrIflg4zDUU3Q-XH715XkwgTJl
            sequenceReference:
              id: refseq:NP_004976.2
              type: SequenceReference
              name: NP_004976.2
              description: The protein product of the KRAS (NM_004985.5) MANE Select coding transcript, corresponding to the Refseq protein accession NP_004976.2.
              refgetAccession: SQ.fytWhQSNGnA-86vDiQCxTSzgkk_WfQRS
              residueAlphabet: aa
            start: 11
            end: 12
            sequence: G
          matchCharacteristic:
            type: MappableConcept
            primaryCoding:
              code: is_within
              system: ga4gh-gks-term:location-match
    presence: absent
